<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EasyLedger{% endblock %}</title>
  <!-- Tailwind CSS Play CDN for rapid prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-black text-indigo-600 tracking-tight">EasyLedger</span>
      </div>
      <nav class="flex items-center space-x-6 text-sm font-medium text-slate-600">
        <a href="{% url 'voucher-create' %}" class="hover:text-indigo-600">New Voucher</a>
        <a href="#" class="hover:text-indigo-600">Day Book</a>
        <a href="#" class="hover:text-indigo-600">Chart of Accounts</a>
      </nav>
    </div>
  </header>

  <!-- Main Canvas -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Custom Scripts -->
  {% block scripts %}
  {% endblock %}
</body>
</html>
