<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}EasyLedger{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  
  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="{% url 'dashboard' %}" class="text-xl font-black text-indigo-600 tracking-tight">EasyLedger</a>
      </div>
      <nav class="flex items-center space-x-6 text-sm font-medium text-slate-600">
        <a href="{% url 'dashboard' %}" class="hover:text-indigo-600">Dashboard</a>
        <a href="{% url 'voucher-create' %}" class="hover:text-indigo-600">New Voucher</a>
        <a href="{% url 'daybook' %}" class="hover:text-indigo-600">Day Book</a>
        <a href="{% url 'coa' %}" class="hover:text-indigo-600">Chart of Accounts</a>
        <a href="{% url 'trial-balance' %}" class="hover:text-indigo-600">Trial Balance</a>
        <a href="{% url 'profit-loss' %}" class="hover:text-indigo-600">Profit & Loss</a>
        <a href="{% url 'balance-sheet' %}" class="hover:text-indigo-600">Balance Sheet</a>
      </nav>
    </div>
  </header>

  <!-- Main Canvas: Full width fluid layout -->
  <main class="flex-1 w-full p-4 sm:p-6 lg:p-8">
    {% if messages %}
    <div class="mb-6 space-y-2">
      {% for message in messages %}
      <div
        class="p-3.5 rounded-lg text-sm font-medium {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% else %}bg-emerald-50 text-emerald-800 border border-emerald-200{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}
  </main>

  {% block scripts %}
  {% endblock %}
</body>

</html>
