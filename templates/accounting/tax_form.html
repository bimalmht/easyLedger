{% extends 'base.html' %}

{% block title %}Tax Configuration Form - EasyLedger{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
  <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">
    {% if tax %}Edit Tax Configuration{% else %}New Tax Configuration{% endif %}
  </h2>

  <form method="POST" class="space-y-4 text-xs">
    {% csrf_token %}
    <div>
      <label class="block font-semibold text-slate-700 mb-1">Tax Name</label>
      <input type="text" name="name" value="{{ tax.name|default:'' }}" required placeholder="e.g. VAT 13% or Excise Duty 5%" class="w-full border border-slate-300 rounded-lg p-2.5">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Tax Type</label>
        <select name="tax_type" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white">
          {% for code, label in tax_types %}
            <option value="{{ code }}" {% if tax.tax_type == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Rate (%)</label>
        <input type="number" step="0.01" name="rate" value="{{ tax.rate|default:'13.00' }}" required class="w-full border border-slate-300 rounded-lg p-2.5 font-mono">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Fiscal Year (FY)</label>
        <input type="text" name="fiscal_year" value="{{ tax.fiscal_year|default:'2083/084' }}" required placeholder="e.g. 2083/084" class="w-full border border-slate-300 rounded-lg p-2.5 font-mono">
      </div>
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Posting Ledger Account</label>
        <select name="ledger_account" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white">
          <option value="">-- Select Ledger --</option>
          {% for acc in accounts %}
            <option value="{{ acc.id }}" {% if tax.ledger_account_id == acc.id %}selected{% endif %}>{{ acc.code }} - {{ acc.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex items-center gap-2 pt-2">
      <input type="checkbox" name="is_active" id="is_active" {% if tax is None or tax.is_active %}checked{% endif %} class="rounded text-indigo-600">
      <label for="is_active" class="font-semibold text-slate-700">Active for this Fiscal Year</label>
    </div>
    <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
      <a href="{% url 'tax-list' %}" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</a>
      <button type="submit" class="px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg font-semibold shadow-sm">Save Configuration</button>
    </div>
  </form>
</div>
{% endblock %}
