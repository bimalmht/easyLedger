{% extends 'base.html' %}

{% block title %}Sign In - EasyLedger{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-indigo-600 tracking-tight">EasyLedger</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with your credentials</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      
      <!-- Preserve the redirect target (e.g. /admin/) -->
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" name="username" required autofocus class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" name="password" required class="w-full text-sm border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-2.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors mt-2">
        Sign In
      </button>
    </form>

    <div class="text-center mt-6 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400">Need an account? Contact your system administrator to register your company.</p>
    </div>
  </div>
</div>
{% endblock %}
